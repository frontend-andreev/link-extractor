<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <!-- Как закрепить Link Extractor: (1) пазл, (2) булавка. Один в один как окно Chrome с пустой стартовой Google
       (решение Даниила 2026-10-29, образец — pdf-to-csv/frontend/public/1-pin.png).
       Заменяемые тексты: <text id="ext-name">, <text id="menu-title"> («Extensions» / «Расширения»),
       <text id="menu-manage"> («Manage extensions» / «Управление расширениями»). Темы — prefers-color-scheme. -->
  <style>
    .frame { fill: #ffffff; stroke: #c7d2e4; }
    .strip { fill: #d3e3fd; }
    .tab, .bar { fill: #ffffff; }
    .page { fill: #ffffff; }
    .line { stroke: #e3e6ea; }
    .omni { fill: #edf2fa; }
    .ico-s { stroke: #474747; fill: none; }
    .ico { fill: #474747; }
    .menu { fill: #ffffff; }
    .sbox { fill: #ffffff; stroke: #dfe1e5; }
    .txt { fill: #1f1f1f; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .hl { fill: #fff1e6; }
    .logo { font: 400 68px "Product Sans", "Google Sans", Arial, Helvetica, sans-serif; letter-spacing: -2px; }
    .g1 { fill: #4285f4; } .g2 { fill: #ea4335; } .g3 { fill: #fbbc05; } .g4 { fill: #34a853; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #202124; stroke: #3c4043; }
      .strip { fill: #1f1f1f; }
      .tab, .bar { fill: #35363a; }
      .page { fill: #202124; }
      .line { stroke: #4a4c50; }
      .omni { fill: #282a2d; }
      .ico-s { stroke: #e3e3e3; }
      .ico { fill: #e3e3e3; }
      .menu { fill: #292a2d; }
      .sbox { fill: #4d5156; stroke: #5f6368; }
      .txt { fill: #e8eaed; }
      .hl { fill: #4a3526; }
      .g1, .g2, .g3, .g4 { fill: #ffffff; }
    }
    .ring { fill: none; stroke: #ff7a1a; stroke-width: 3; }
    .mark { fill: #ff7a1a; }
    .num { fill: #ffffff; font: 700 16px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-anchor: middle; }
  </style>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <clipPath id="le-low"><rect x="40" y="64" width="60" height="40"/></clipPath>
    <clipPath id="win"><rect x="0.5" y="0.5" width="719" height="359" rx="14"/></clipPath>
    <!-- иконка Link Extractor (factory/data/graphics/link-extractor/final/icons/icon.svg), поле 128×128 -->
    <g id="le-icon">
      <g transform="rotate(-45 64 64)" fill="none" stroke-width="15">
        <rect x="2" y="45" width="76" height="38" rx="19" stroke="#2F7CF6"/>
        <rect x="50" y="45" width="76" height="38" rx="19" stroke="#FF7A1A"/>
        <rect x="2" y="45" width="76" height="38" rx="19" stroke="#2F7CF6" clip-path="url(#le-low)"/>
      </g>
    </g>
    <path id="puzzle" d="M-8 -4 H-2.5 A3.2 3.2 0 1 1 2.5 -4 H7 V0.5 A3.2 3.2 0 1 1 7 5.5 V10 H-8 Z" stroke-width="2" stroke-linejoin="round"/>
    <g id="pin" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-4 -9 H4 L3 -3 L7 2 H-7 L-3 -3 Z"/><path d="M0 2 V10"/>
    </g>
    <g id="kebab"><circle cx="0" cy="-6" r="1.8"/><circle cx="0" cy="0" r="1.8"/><circle cx="0" cy="6" r="1.8"/></g>
  </defs>

  <rect class="frame" x="0.5" y="0.5" width="719" height="359" rx="14"/>
  <g clip-path="url(#win)">
    <!-- полоса вкладок -->
    <rect class="strip" x="0" y="0" width="720" height="42"/>
    <circle cx="20" cy="21" r="6" fill="#ff5f57"/><circle cx="40" cy="21" r="6" fill="#febc2e"/><circle cx="60" cy="21" r="6" fill="#28c840"/>
    <path class="tab" d="M82 42 Q90 42 90 34 V18 Q90 9 99 9 H243 Q252 9 252 18 V34 Q252 42 260 42 Z"/>
    <g class="ico-s" stroke-width="1.6"><circle cx="110" cy="26" r="7"/><path d="M103 26 H117 M110 19 Q105 26 110 33 Q115 26 110 19"/></g>
    <g class="ico-s" stroke-width="1.8" stroke-linecap="round"><path d="M231 22 L239 30 M239 22 L231 30"/></g>
    <g class="ico-s" stroke-width="1.8" stroke-linecap="round"><path d="M276 26 H288 M282 20 V32"/></g>

    <!-- тулбар -->
    <rect class="bar" x="0" y="42" width="720" height="48"/>
    <g class="ico-s" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M33 66 H19 M25 60 L19 66 L25 72"/>
      <path d="M53 66 H67 M61 60 L67 66 L61 72"/>
      <path d="M104 66 A8 8 0 1 1 101.6 60.3 M102 56.5 V60.5 H98"/>
    </g>
    <rect class="omni" x="122" y="50" width="420" height="32" rx="16"/>
    <!-- (1) пазл -->
    <circle class="hl" cx="574" cy="66" r="18"/>
    <circle class="ring" cx="574" cy="66" r="19"/>
    <use href="#puzzle" class="ico-s" transform="translate(574 66)"/>
    <circle class="mark" cx="548" cy="30" r="12"/><text class="num" x="548" y="35.5">1</text>
    <path d="M556 38 L562 47" stroke="#ff7a1a" stroke-width="2.5" stroke-linecap="round"/>
    <g class="ico-s" stroke-width="2"><rect x="603" y="58" width="18" height="16" rx="2.5"/><path d="M615 58 V74"/></g>
    <circle cx="646" cy="66" r="12" fill="#4285f4"/>
    <g fill="#ffffff"><circle cx="646" cy="62.5" r="4"/><path d="M638.5 73.5 A8 8 0 0 1 653.5 73.5 Z"/></g>
    <use href="#kebab" class="ico" x="684" y="66"/>
    <path class="line" d="M0 90.5 H720"/>

    <!-- пустая стартовая страница Google -->
    <rect class="page" x="0" y="91" width="720" height="270"/>
    <g class="ico"><circle cx="676" cy="112" r="2"/><circle cx="684" cy="112" r="2"/><circle cx="692" cy="112" r="2"/>
      <circle cx="676" cy="120" r="2"/><circle cx="684" cy="120" r="2"/><circle cx="692" cy="120" r="2"/>
      <circle cx="676" cy="128" r="2"/><circle cx="684" cy="128" r="2"/><circle cx="692" cy="128" r="2"/></g>
    <text class="logo" x="360" y="236" text-anchor="middle"><tspan class="g1">G</tspan><tspan class="g2">o</tspan><tspan class="g3">o</tspan><tspan class="g1">g</tspan><tspan class="g4">l</tspan><tspan class="g2">e</tspan></text>
    <rect class="sbox" x="150" y="270" width="420" height="46" rx="23"/>
    <g class="ico-s" stroke-width="2" stroke-linecap="round"><circle cx="177" cy="291" r="6.5"/><path d="M182 296 L187 301"/></g>
    <g stroke-linecap="round" fill="none" stroke-width="2.2">
      <rect x="533" y="282" width="8" height="13" rx="4" fill="#4285f4"/>
      <path d="M529 290 A8 8 0 0 0 545 290" stroke="#34a853"/><path d="M537 298 V302" stroke="#ea4335"/>
    </g>

    <!-- меню расширений -->
    <g filter="url(#sh)"><rect class="menu" x="396" y="96" width="306" height="164" rx="12"/></g>
    <text id="menu-title" class="txt" x="418" y="130" font-size="17" font-weight="600">Расширения</text>
    <g class="ico-s" transform="translate(680 124)" stroke-width="2" stroke-linecap="round"><path d="M-5 -5 L5 5 M5 -5 L-5 5"/></g>
    <use href="#le-icon" transform="translate(418 154) scale(0.1875)"/>
    <text id="ext-name" class="txt" x="452" y="173" font-size="16">Link Extractor</text>
    <!-- (2) булавка -->
    <circle class="hl" cx="664" cy="166" r="17"/>
    <circle class="ring" cx="664" cy="166" r="18"/>
    <use href="#pin" class="ico-s" x="664" y="166"/>
    <circle class="mark" cx="694" cy="196" r="12"/><text class="num" x="694" y="201.5">2</text>
    <path d="M686 188 L679 180" stroke="#ff7a1a" stroke-width="2.5" stroke-linecap="round"/>
    <path class="line" d="M396 202.5 H702"/>
    <g class="ico-s" stroke-width="2" transform="translate(429 230)">
      <circle r="3"/><path d="M0 -8 V-5.5 M0 5.5 V8 M-8 0 H-5.5 M5.5 0 H8 M-5.7 -5.7 L-3.9 -3.9 M3.9 3.9 L5.7 5.7 M-5.7 5.7 L-3.9 3.9 M3.9 -3.9 L5.7 -5.7" stroke-linecap="round"/>
    </g>
    <text id="menu-manage" class="txt" x="452" y="235" font-size="15">Управление расширениями</text>
  </g>
</svg>
