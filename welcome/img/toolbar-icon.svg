<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" width="720" height="120">
  <!-- Тулбар Chrome с закреплённой иконкой Link Extractor (оранжевое кольцо) — как тулбар в pin-steps.svg.
       Без слов; светлая и тёмная тема — prefers-color-scheme. -->
  <style>
    .bar { fill: #ffffff; stroke: #c7d2e4; }
    .omni { fill: #edf2fa; }
    .ico-s { stroke: #474747; fill: none; }
    .ico { fill: #474747; }
    .hl { fill: #fff1e6; }
    @media (prefers-color-scheme: dark) {
      .bar { fill: #35363a; stroke: #4a4c50; }
      .omni { fill: #282a2d; }
      .ico-s { stroke: #e3e3e3; }
      .ico { fill: #e3e3e3; }
      .hl { fill: #4a3526; }
    }
    .ring { fill: none; stroke: #ff7a1a; stroke-width: 3; }
  </style>
  <defs>
    <clipPath id="le-low"><rect x="40" y="64" width="60" height="40"/></clipPath>
    <g id="le-icon">
      <g transform="rotate(-45 64 64)" fill="none" stroke-width="15">
        <rect x="2" y="45" width="76" height="38" rx="19" stroke="#2F7CF6"/>
        <rect x="50" y="45" width="76" height="38" rx="19" stroke="#FF7A1A"/>
        <rect x="2" y="45" width="76" height="38" rx="19" stroke="#2F7CF6" clip-path="url(#le-low)"/>
      </g>
    </g>
    <path id="puzzle" d="M-8 -4 H-2.5 A3.2 3.2 0 1 1 2.5 -4 H7 V0.5 A3.2 3.2 0 1 1 7 5.5 V10 H-8 Z" stroke-width="2" stroke-linejoin="round"/>
    <g id="kebab"><circle cx="0" cy="-7" r="2.2"/><circle cx="0" cy="0" r="2.2"/><circle cx="0" cy="7" r="2.2"/></g>
  </defs>
  <rect class="bar" x="0.5" y="0.5" width="719" height="119" rx="18"/>
  <g class="ico-s" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 60 H20 M27 53 L20 60 L27 67"/>
    <path d="M58 60 H76 M69 53 L76 60 L69 67"/>
    <path d="M119 60 A10 10 0 1 1 116 52.9 M116.5 48 V53 H111.5"/>
  </g>
  <rect class="omni" x="140" y="40" width="340" height="40" rx="20"/>
  <!-- закреплённая иконка Link Extractor -->
  <circle class="hl" cx="516" cy="60" r="24"/>
  <circle class="ring" cx="516" cy="60" r="25"/>
  <use href="#le-icon" transform="translate(501 45) scale(0.234375)"/>
  <use href="#puzzle" class="ico-s" transform="translate(566 59) scale(1.3)"/>
  <g class="ico-s" stroke-width="2.3"><rect x="598" y="49" width="24" height="22" rx="3"/><path d="M614 49 V71"/></g>
  <circle cx="654" cy="60" r="15" fill="#4285f4"/>
  <g fill="#ffffff"><circle cx="654" cy="55.5" r="5"/><path d="M644.5 70 A10 10 0 0 1 663.5 70 Z"/></g>
  <use href="#kebab" class="ico" x="698" y="60"/>
</svg>
