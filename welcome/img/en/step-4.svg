<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300">
  <!-- Шаг 4: выделили текст на странице, правый клик → наш пункт меню. Пункт — <text id="menu-item"> (заменить для ru:
       «Извлечь ссылки из выделенного», menuCollectSelection). Остальные пункты меню Chrome — скелетоны. -->
  <style>
    .page { fill: #ffffff; stroke: #dfe3e8; }
    .sk { fill: #e3e6ea; }
    .sel { fill: #cfe0fc; }
    .lnk { fill: #1a5fd0; }
    .menu { fill: #ffffff; }
    .item-hl { fill: #e8f0fe; }
    .txt { fill: #202124; font: 500 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .line { stroke: #e3e6ea; }
    @media (prefers-color-scheme: dark) {
      .page { fill: #1f2125; stroke: #3c4043; }
      .sk { fill: #3c3f44; }
      .sel { fill: #2c4a78; }
      .lnk { fill: #8ab4f8; }
      .menu { fill: #292a2d; }
      .item-hl { fill: #3a4a63; }
      .txt { fill: #e8eaed; }
      .line { stroke: #45484d; }
    }
  </style>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <clipPath id="le-low"><rect x="40" y="64" width="60" height="40"/></clipPath>
    <g id="le-icon">
      <g transform="rotate(-45 64 64)" fill="none" stroke-width="15">
        <rect x="2" y="45" width="76" height="38" rx="19" stroke="#2F7CF6"/>
        <rect x="50" y="45" width="76" height="38" rx="19" stroke="#FF7A1A"/>
        <rect x="2" y="45" width="76" height="38" rx="19" stroke="#2F7CF6" clip-path="url(#le-low)"/>
      </g>
    </g>
  </defs>
  <rect class="page" x="0.5" y="0.5" width="359" height="299" rx="14"/>
  <rect class="sk" x="24" y="26" width="200" height="10" rx="5"/>
  <!-- выделенный абзац со ссылками -->
  <rect class="sel" x="20" y="48" width="320" height="22" rx="3"/>
  <rect class="sel" x="20" y="72" width="300" height="22" rx="3"/>
  <rect class="sel" x="20" y="96" width="180" height="22" rx="3"/>
  <rect class="sk" x="24" y="55" width="60" height="9" rx="4.5"/><rect class="lnk" x="92" y="55" width="70" height="9" rx="4.5"/>
  <rect class="sk" x="170" y="55" width="150" height="9" rx="4.5"/>
  <rect class="lnk" x="24" y="79" width="90" height="9" rx="4.5"/><rect class="sk" x="122" y="79" width="180" height="9" rx="4.5"/>
  <rect class="sk" x="24" y="103" width="50" height="9" rx="4.5"/><rect class="lnk" x="82" y="103" width="100" height="9" rx="4.5"/>
  <rect class="sk" x="24" y="132" width="220" height="10" rx="5"/>
  <!-- контекстное меню -->
  <g filter="url(#sh)"><rect class="menu" x="70" y="122" width="270" height="160" rx="10"/></g>
  <rect class="sk" x="90" y="142" width="70" height="9" rx="4.5"/>
  <rect class="sk" x="90" y="168" width="140" height="9" rx="4.5"/>
  <path class="line" d="M80 190.5 H330"/>
  <rect class="item-hl" x="78" y="198" width="254" height="38" rx="7"/>
  <use href="#le-icon" transform="translate(88 207) scale(0.15625)"/>
  <text id="menu-item" class="txt" x="116" y="222">Extract links from the selection</text>
  <path class="line" d="M80 244.5 H330"/>
  <rect class="sk" x="90" y="258" width="90" height="9" rx="4.5"/>
</svg>
